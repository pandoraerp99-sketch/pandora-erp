# Secret scanning con gitleaks — corre en push a main + pull_request.
# Falla el job si detecta secrets en cualquier archivo del repo.
#
# Origen: hallazgo del forensic check 2026-06-04 (gap CI/CD ausente). El
# audit Copilot 2026-06-06 propuso esto en el repo SRS (incorrecto — los
# secrets viven en pandora-erp, no en docs). Adaptado y movido aca.
name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Full history para escanear todo el historial git (no solo HEAD).
          # Importante: secrets viejos commiteados quedan en history hasta
          # rewrite explicito (filter-branch / BFG). Detectarlos es el punto.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
